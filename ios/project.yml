name: ShareDL
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    GENERATE_INFOPLIST_FILE: NO

targets:
  ShareDL:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).sharedl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ServerHost: $(SERVER_HOST)
        ServerPort: $(SERVER_PORT)
        APIToken: $(API_TOKEN)
        NSPhotoLibraryAddUsageDescription: ShareDL saves downloaded videos to your camera roll.
        NSLocalNetworkUsageDescription: ShareDL talks to the download server on your Mac.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).sharedl.share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save Video
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ServerHost: $(SERVER_HOST)
        ServerPort: $(SERVER_PORT)
        APIToken: $(API_TOKEN)
        NSPhotoLibraryAddUsageDescription: ShareDL saves downloaded videos to your camera roll.
        NSLocalNetworkUsageDescription: ShareDL talks to the download server on your Mac.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
